name: Praxis 2 Go

on:
  push:
    branches:
      - redesign/praxis2
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'proto/**'
      - 'migrations/sqlite/**'
      - '.github/workflows/praxis2-go.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: |
          unformatted="$(gofmt -l $(find . -type f -name '*.go' -not -path './.git/*'))"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
