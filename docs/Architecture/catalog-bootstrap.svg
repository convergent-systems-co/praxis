<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Praxis 2 Catalog Bootstrap and Local Adaptation</title><desc id="desc">Catalog packages provide generalized graph and agent priors, preference contracts, and behavioral profiles that are instantiated locally and then evolve independently for the user and context.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.title{font:700 28px system-ui,sans-serif;fill:#0f172a}.sub{font:500 15px system-ui,sans-serif;fill:#475569}.h{font:700 17px system-ui,sans-serif;fill:#0f172a}.t{font:14px system-ui,sans-serif;fill:#334155}.small{font:12px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:14}.soft{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.local{fill:#f1f5f9;stroke:#0f172a;stroke-width:2;rx:14}.external{fill:#fff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 4;rx:14}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#arrow)}</style></defs><rect width="1400" height="900" fill="#fff"/><text x="55" y="55" class="title">Praxis 2 — Catalog Bootstrap and Local Adaptation</text><text x="55" y="82" class="sub">Learn locally, bootstrap collectively. Catalog artifacts are starting priors, not global truths.</text><rect x="60" y="140" width="330" height="250" class="external"/><text x="225" y="178" text-anchor="middle" class="h">Optional Catalog</text><text x="95" y="215" class="t">Praxis package may contain:</text><text x="110" y="243" class="small">• graph / graph fragments</text><text x="110" y="268" class="small">• agent seed</text><text x="110" y="293" class="small">• hooks / validators / evaluators</text><text x="110" y="318" class="small">• behavioral profile</text><text x="110" y="343" class="small">• preference contract</text><text x="110" y="368" class="small">• trust + evidence + lineage metadata</text><rect x="450" y="140" width="280" height="250" class="box"/><text x="590" y="178" text-anchor="middle" class="h">Fit + Trust Resolver</text><text x="485" y="217" class="t">match by:</text><text x="500" y="245" class="small">goal similarity</text><text x="500" y="270" class="small">behavioral style</text><text x="500" y="295" class="small">environment/capabilities</text><text x="500" y="320" class="small">risk/autonomy/evidence depth</text><text x="500" y="345" class="small">publisher/signature/trust</text><text x="500" y="370" class="small">evidenced fit, not popularity</text><path d="M390 265 L450 265" class="arrow"/><rect x="790" y="140" width="260" height="250" class="soft"/><text x="920" y="178" text-anchor="middle" class="h">Preference Contract</text><text x="825" y="217" class="t">ask only material inputs:</text><text x="840" y="248" class="small">required setup</text><text x="840" y="278" class="small">optional preference</text><text x="840" y="308" class="small">learnable preference</text><text x="825" y="345" class="small">answers become explicit scoped</text><text x="825" y="367" class="small">evidence, never immutable config</text><path d="M730 265 L790 265" class="arrow"/><rect x="1110" y="140" width="230" height="250" class="local"/><text x="1225" y="178" text-anchor="middle" class="h">Local Instantiation</text><text x="1140" y="218" class="t">new local lineage</text><text x="1140" y="248" class="small">package ancestry retained</text><text x="1140" y="278" class="small">user/context scope applied</text><text x="1140" y="308" class="small">local preferences seeded</text><text x="1140" y="338" class="small">adaptation points enabled</text><text x="1140" y="368" class="small">private by default</text><path d="M1050 265 L1110 265" class="arrow"/><rect x="220" y="500" width="310" height="180" class="local"/><text x="375" y="538" text-anchor="middle" class="h">Thomas / Home Descendant</text><text x="260" y="578" class="t">example learned variant:</text><text x="275" y="608" class="small">workspace isolation → worktree</text><text x="275" y="635" class="small">architecture-first process</text><text x="275" y="662" class="small">high deterministic reuse</text><rect x="870" y="500" width="310" height="180" class="local"/><text x="1025" y="538" text-anchor="middle" class="h">David / Context Descendant</text><text x="910" y="578" class="t">example learned variant:</text><text x="925" y="608" class="small">workspace isolation → dev container</text><text x="925" y="635" class="small">prototype-first process</text><text x="925" y="662" class="small">different checkpoint density</text><path d="M1225 390 C1120 450 520 430 375 500" class="arrow"/><path d="M1225 390 C1210 450 1100 460 1025 500" class="arrow"/><rect x="540" y="510" width="320" height="160" class="soft"/><text x="700" y="547" text-anchor="middle" class="h">Local Learning</text><text x="575" y="582" class="small">outcomes + corrections + overrides</text><text x="575" y="607" class="small">context-specific process discovery</text><text x="575" y="632" class="small">graph/agent generations evolve independently</text><path d="M530 590 L540 590" class="dash"/><path d="M870 590 L860 590" class="dash"/><rect x="460" y="755" width="480" height="95" class="external"/><text x="700" y="790" text-anchor="middle" class="h">Optional Generalized Contribution</text><text x="700" y="818" text-anchor="middle" class="t">de-identify • scope review • evidence • explicit contribution policy</text><text x="700" y="840" text-anchor="middle" class="small">personal descendants never automatically become the next catalog version</text><path d="M375 680 C430 725 520 735 600 755" class="dash"/><path d="M1025 680 C970 725 880 735 800 755" class="dash"/><path d="M460 802 C300 810 180 650 225 390" class="dash"/></svg>