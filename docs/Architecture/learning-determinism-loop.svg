<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Praxis 2 Learning and Determinism Extraction Loop</title><desc id="desc">Inference, evidence, pattern discovery, deterministic extraction, governance, monitoring, and demotion.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.title{font:700 28px system-ui,sans-serif;fill:#0f172a}.sub{font:500 15px system-ui,sans-serif;fill:#475569}.h{font:700 17px system-ui,sans-serif;fill:#0f172a}.t{font:14px system-ui,sans-serif;fill:#334155}.small{font:12px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:14}.soft{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.candidate{fill:#f1f5f9;stroke:#475569;stroke-width:2;stroke-dasharray:7 4;rx:14}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#arrow)}</style></defs><rect width="1400" height="900" fill="#fff"/><text x="55" y="55" class="title">Praxis 2 — Learning and Determinism Extraction</text><text x="55" y="82" class="sub">Better delivery by eliminating repeated reasoning that evidence has already resolved.</text><rect x="70" y="150" width="210" height="90" class="box"/><text x="175" y="185" text-anchor="middle" class="h">Novel / Uncertain Work</text><text x="175" y="210" text-anchor="middle" class="t">Inference is appropriate</text><rect x="340" y="150" width="210" height="90" class="box"/><text x="445" y="185" text-anchor="middle" class="h">Inference Executes</text><text x="445" y="210" text-anchor="middle" class="t">bounded to graph node</text><rect x="610" y="150" width="210" height="90" class="box"/><text x="715" y="185" text-anchor="middle" class="h">Evidence Captured</text><text x="715" y="210" text-anchor="middle" class="t">outcome • correction • cost</text><rect x="880" y="150" width="210" height="90" class="box"/><text x="985" y="185" text-anchor="middle" class="h">Pattern Discovery</text><text x="985" y="210" text-anchor="middle" class="t">repeatability + scope</text><path d="M280 195 L340 195" class="arrow"/><path d="M550 195 L610 195" class="arrow"/><path d="M820 195 L880 195" class="arrow"/><rect x="1130" y="130" width="210" height="130" class="soft"/><text x="1235" y="165" text-anchor="middle" class="h">Stable enough?</text><text x="1235" y="192" text-anchor="middle" class="t">repeatable?</text><text x="1235" y="214" text-anchor="middle" class="t">scope known?</text><text x="1235" y="236" text-anchor="middle" class="t">escape path defined?</text><path d="M1090 195 L1130 195" class="arrow"/><rect x="1030" y="345" width="310" height="210" class="candidate"/><text x="1185" y="380" text-anchor="middle" class="h">Determinism Candidate</text><text x="1060" y="414" class="t">graph edge / subgraph</text><text x="1060" y="440" class="t">hook / validator / schema</text><text x="1060" y="466" class="t">tool / fixed transformation</text><text x="1060" y="492" class="t">policy / routing / threshold</text><text x="1060" y="518" class="t">state transition</text><path d="M1235 260 L1235 345" class="arrow"/><rect x="660" y="385" width="260" height="130" class="box"/><text x="790" y="420" text-anchor="middle" class="h">Evaluate Candidate</text><text x="790" y="449" text-anchor="middle" class="t">replay • tests • comparison</text><text x="790" y="473" text-anchor="middle" class="t">quality • cost • regressions</text><text x="790" y="497" text-anchor="middle" class="small">delivery quality dominates token savings</text><path d="M1030 450 L920 450" class="arrow"/><rect x="350" y="385" width="230" height="130" class="box"/><text x="465" y="420" text-anchor="middle" class="h">Governance Gate</text><text x="465" y="449" text-anchor="middle" class="t">scope • authority • privacy</text><text x="465" y="473" text-anchor="middle" class="t">promote / reject / stage</text><text x="465" y="497" text-anchor="middle" class="small">preserve parent + rollback</text><path d="M660 450 L580 450" class="arrow"/><rect x="70" y="385" width="210" height="130" class="box"/><text x="175" y="420" text-anchor="middle" class="h">Active Determinism</text><text x="175" y="449" text-anchor="middle" class="t">known path executes</text><text x="175" y="473" text-anchor="middle" class="t">without model choice</text><text x="175" y="497" text-anchor="middle" class="small">exceptions remain observable</text><path d="M350 450 L280 450" class="arrow"/><rect x="70" y="650" width="300" height="135" class="soft"/><text x="220" y="685" text-anchor="middle" class="h">Monitor Active Behavior</text><text x="220" y="714" text-anchor="middle" class="t">success • fallback • override</text><text x="220" y="738" text-anchor="middle" class="t">drift • context change • regressions</text><text x="220" y="762" text-anchor="middle" class="small">deterministic ≠ permanent</text><path d="M175 515 L175 650" class="arrow"/><rect x="500" y="650" width="330" height="135" class="candidate"/><text x="665" y="685" text-anchor="middle" class="h">Contradiction / Drift?</text><text x="665" y="714" text-anchor="middle" class="t">explicit preference change</text><text x="665" y="738" text-anchor="middle" class="t">repeated exception or degraded result</text><text x="665" y="762" text-anchor="middle" class="small">context split may be valid, not conflict</text><path d="M370 718 L500 718" class="arrow"/><rect x="960" y="650" width="380" height="135" class="soft"/><text x="1150" y="685" text-anchor="middle" class="h">Adapt / Split / Demote</text><text x="1150" y="714" text-anchor="middle" class="t">new graph generation or contextual variant</text><text x="1150" y="738" text-anchor="middle" class="t">return decision to inference when uncertain</text><text x="1150" y="762" text-anchor="middle" class="small">learning remains reversible</text><path d="M830 718 L960 718" class="arrow"/><path d="M1150 650 C1110 580 600 590 445 240" class="dash"/><path d="M1180 130 C1110 95 100 95 175 150" class="dash"/><text x="820" y="105" class="small">If not stable, keep the decision inferential and continue learning.</text></svg>