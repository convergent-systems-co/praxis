<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Praxis 2 Local-First State and Multi-Machine Reconciliation</title><desc id="desc">Portable Praxis-owned state is separated from machine-local state and reconciled across machines with provenance-preserving merge semantics.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.title{font:700 28px system-ui,sans-serif;fill:#0f172a}.sub{font:500 15px system-ui,sans-serif;fill:#475569}.h{font:700 17px system-ui,sans-serif;fill:#0f172a}.t{font:14px system-ui,sans-serif;fill:#334155}.small{font:12px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:14}.soft{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.portable{fill:#f1f5f9;stroke:#0f172a;stroke-width:2;rx:14}.external{fill:#fff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 4;rx:14}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#arrow)}</style></defs><rect width="1400" height="900" fill="#fff"/><text x="55" y="55" class="title">Praxis 2 — Local-First State and Multi-Machine Reconciliation</text><text x="55" y="82" class="sub">Praxis owns the canonical state model. Sync providers move state; they do not define it.</text><rect x="70" y="135" width="360" height="190" class="soft"/><text x="95" y="170" class="h">Machine A — Home</text><rect x="100" y="195" width="300" height="95" class="box"/><text x="120" y="225" class="t">Machine-local state</text><text x="120" y="250" class="small">credentials • paths • installed models</text><text x="120" y="273" class="small">hardware • network • local policy/cache</text><rect x="970" y="135" width="360" height="190" class="soft"/><text x="995" y="170" class="h">Machine B — Work</text><rect x="1000" y="195" width="300" height="95" class="box"/><text x="1020" y="225" class="t">Machine-local state</text><text x="1020" y="250" class="small">credentials • paths • executors</text><text x="1020" y="273" class="small">corporate constraints • host facts</text><rect x="450" y="125" width="500" height="230" class="portable"/><text x="700" y="162" text-anchor="middle" class="h">Praxis Portable State — Generation N</text><text x="485" y="202" class="t">• user/context profiles + preference history</text><text x="485" y="230" class="t">• agent identities, generations, capability evidence</text><text x="485" y="258" class="t">• graph definitions, fragments, lineage, promotion state</text><text x="485" y="286" class="t">• learned procedures + deterministic artifacts</text><text x="485" y="314" class="t">• evidence summaries + catalog ancestry + governance metadata</text><path d="M430 235 L450 235" class="arrow"/><path d="M970 235 L950 235" class="arrow"/><rect x="70" y="415" width="360" height="165" class="box"/><text x="250" y="452" text-anchor="middle" class="h">Concurrent Learning A</text><text x="250" y="482" text-anchor="middle" class="t">home-scoped preferences</text><text x="250" y="508" text-anchor="middle" class="t">graph descendant N+A</text><text x="250" y="534" text-anchor="middle" class="small">provenance retained</text><rect x="970" y="415" width="360" height="165" class="box"/><text x="1150" y="452" text-anchor="middle" class="h">Concurrent Learning B</text><text x="1150" y="482" text-anchor="middle" class="t">work-scoped preferences</text><text x="1150" y="508" text-anchor="middle" class="t">graph descendant N+B</text><text x="1150" y="534" text-anchor="middle" class="small">provenance retained</text><path d="M250 325 L250 415" class="arrow"/><path d="M1150 325 L1150 415" class="arrow"/><rect x="480" y="430" width="440" height="200" class="portable"/><text x="700" y="468" text-anchor="middle" class="h">Reconciliation Engine</text><text x="520" y="505" class="t">classify changes:</text><text x="540" y="532" class="small">identical • independent • compatible merge</text><text x="540" y="557" class="small">context split • preference supersession</text><text x="540" y="582" class="small">graph fork • semantic conflict</text><text x="520" y="610" class="small">Never blind last-writer-wins for learned state.</text><path d="M430 500 L480 500" class="arrow"/><path d="M970 500 L920 500" class="arrow"/><rect x="480" y="690" width="440" height="125" class="portable"/><text x="700" y="728" text-anchor="middle" class="h">Generation N+1 or Parallel Descendants</text><text x="700" y="758" text-anchor="middle" class="t">merge compatible learning; preserve contextual divergence</text><text x="700" y="785" text-anchor="middle" class="small">unresolved semantic conflicts remain explicit and reviewable</text><path d="M700 630 L700 690" class="arrow"/><rect x="970" y="690" width="360" height="125" class="external"/><text x="1150" y="728" text-anchor="middle" class="h">Replaceable Transport</text><text x="1150" y="758" text-anchor="middle" class="t">encrypted archive • P2P • SSH • Git</text><text x="1150" y="785" text-anchor="middle" class="small">object store or future provider</text><path d="M920 752 L970 752" class="dash"/><text x="70" y="855" class="small">Context is not machine identity: a home machine can execute work context and vice versa. Explicit context and policy outrank host hints.</text></svg>